# Builds the APK in GitHub's cloud and attaches it to a Release, so it can be downloaded and installed
# straight from a phone browser: github.com/<you>/<repo>/releases
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug --no-daemon
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Sunday.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Sunday.apk --title "Sunday $TAG" --notes "Debug build" --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sunday-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
